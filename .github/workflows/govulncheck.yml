name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekdays 08:00 UTC: scan unchanged code against the latest vulnerability
    # database, so that a newly published vulnerability in a dependency or the
    # standard library shows up without a commit.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same Go as the other workflows, which build the binaries and the
      # Pages site, so that standard library findings are for that toolchain.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Fails only on vulnerabilities that the code calls, in dependencies or
      # the standard library. Others are listed without failing.
      - name: Run govulncheck
        run: govulncheck ./...

      # The browser build compiles other files, such as fetch/js.go.
      - name: Run govulncheck on the wasm build
        run: GOOS=js GOARCH=wasm govulncheck ./cmd/dashcheck-wasm
