name: golangci-lint

on:
  push:
    branches: [main]
    tags:
      - v*
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true

      - name: golangci-lint js/wasm
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: js
          GOARCH: wasm
        with:
          args: ./fetch ./cmd/dashcheck-wasm
          only-new-issues: true
