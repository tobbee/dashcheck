name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.27"]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check trailing whitespace
        if: matrix.os == 'ubuntu-latest'
        # As the pre-commit hook; the MPEG schema files are kept as published.
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- ':!schema/xsd'; then
            echo "Trailing whitespace on the lines above"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Build wasm
        run: GOOS=js GOARCH=wasm go build -o "$RUNNER_TEMP/dashcheck.wasm" ./cmd/dashcheck-wasm

      - name: Test
        run: go test ./...
