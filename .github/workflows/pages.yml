name: Pages

# Publishes the browser tool (web/ with the wasm) for each release. Pages
# needs a public repository, so the job is skipped while it is private.
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags give the version in the page footer

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Build the page
        run: make web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
