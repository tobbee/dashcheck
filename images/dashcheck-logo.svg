<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gopherBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fd5ea" />
      <stop offset="100%" stop-color="#5dc9e2" />
    </linearGradient>
    <linearGradient id="checkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Background Card -->
  <rect x="8" y="8" width="784" height="304" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Subtle Background Grid Lines (Timeline / Segment vibe) -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="290" y1="8" x2="290" y2="312" stroke-dasharray="6 6" />
    <line x1="8" y1="245" x2="792" y2="245" />
  </g>

  <!-- ==================== GOPHER MASCOT ==================== -->
  <g transform="translate(42, 38)" filter="url(#shadow)">
    <!-- Left & Right Ears -->
    <circle cx="38" cy="42" r="18" fill="#5dc9e2" stroke="#0f172a" stroke-width="4.5" />
    <circle cx="38" cy="42" r="8" fill="#4ab0c9" />
    <circle cx="152" cy="42" r="18" fill="#5dc9e2" stroke="#0f172a" stroke-width="4.5" />
    <circle cx="152" cy="42" r="8" fill="#4ab0c9" />

    <!-- Gopher Body -->
    <path d="M 28 110 C 28 32, 162 32, 162 110 L 168 215 C 168 235, 148 242, 95 242 C 42 242, 22 235, 22 215 Z"
          fill="url(#gopherBlue)" stroke="#0f172a" stroke-width="5" />

    <!-- Lighter Belly Patch -->
    <ellipse cx="95" cy="175" rx="46" ry="52" fill="#a5e6f5" opacity="0.65" />

    <!-- Feet -->
    <ellipse cx="52" cy="238" rx="18" ry="10" fill="#e2d1b5" stroke="#0f172a" stroke-width="4" />
    <ellipse cx="138" cy="238" rx="18" ry="10" fill="#e2d1b5" stroke="#0f172a" stroke-width="4" />

    <!-- Big Go Eyes -->
    <circle cx="67" cy="88" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="4.5" />
    <circle cx="123" cy="88" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="4.5" />
    <!-- Pupils (looking slightly right toward the MPD/Check) -->
    <circle cx="75" cy="88" r="10" fill="#0f172a" />
    <circle cx="78" cy="84" r="3.5" fill="#ffffff" />
    <circle cx="131" cy="88" r="10" fill="#0f172a" />
    <circle cx="134" cy="84" r="3.5" fill="#ffffff" />

    <!-- Snout & Teeth -->
    <rect x="83" y="118" width="11" height="16" rx="2.5" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" />
    <rect x="95" y="118" width="11" height="16" rx="2.5" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" />
    <ellipse cx="95" cy="114" rx="22" ry="12" fill="#e2d1b5" stroke="#0f172a" stroke-width="4" />
    <!-- Nose -->
    <ellipse cx="95" cy="108" rx="10" ry="6" fill="#0f172a" />

    <!-- Left Arm -->
    <path d="M 26 142 C 8 155, 12 182, 34 185" fill="#5dc9e2" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />

    <!-- Right Arm holding Magnifying Glass / Conformance Badge -->
    <path d="M 158 145 C 182 148, 195 162, 185 182" fill="#5dc9e2" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />

    <!-- Magnifying Glass Handle -->
    <line x1="175" y1="168" x2="205" y2="205" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
    <line x1="175" y1="168" x2="205" y2="205" stroke="#0f172a" stroke-width="14" stroke-linecap="round" opacity="0.25" />

    <!-- Conformance Checkmark Lens Badge -->
    <circle cx="168" cy="148" r="34" fill="url(#checkGreen)" stroke="#0f172a" stroke-width="5" />
    <circle cx="168" cy="148" r="27" fill="none" stroke="#86efac" stroke-width="2" opacity="0.6" />
    <path d="M 152 148 L 163 160 L 186 135" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== TEXT & DASH GRAPHICS ==================== -->
  <!-- Top Pill Tags: <MPD>, Segment Blocks, Live Timing -->
  <g transform="translate(300, 48)">
    <!-- MPD Tag Badge -->
    <rect x="0" y="0" width="88" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="44" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">&lt;MPD&gt;</text>

    <!-- Segmented Media Timeline Blocks (.m4s) -->
    <g transform="translate(104, 4)">
      <rect x="0" y="0" width="28" height="24" rx="4" fill="#0284c7" />
      <rect x="34" y="0" width="28" height="24" rx="4" fill="#0ea5e9" />
      <rect x="68" y="0" width="28" height="24" rx="4" fill="#38bdf8" />
      <rect x="102" y="0" width="28" height="24" rx="4" fill="#22c55e" />
    </g>

    <!-- Live Timing Indicator -->
    <g transform="translate(252, 0)">
      <rect x="0" y="0" width="124" height="32" rx="16" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
      <circle cx="20" cy="16" r="5" fill="#22c55e" />
      <text x="68" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="0.8">LIVE TIMING</text>
    </g>
  </g>

  <!-- Main Title: dashcheck -->
  <text x="300" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#f8fafc">dash</tspan><tspan fill="#22c55e">check</tspan>
  </text>

  <!-- Two-line Subtitle (matching the clean go-608 hierarchy) -->
  <text x="302" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#7fd5ea" letter-spacing="2.5">
    MPEG-DASH CONFORMANCE
  </text>
  <text x="302" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#94a3b8" letter-spacing="3">
    CHECKER IN GO
  </text>

  <!-- Bottom Segmented Progress Bar Accent -->
  <g transform="translate(302, 260)">
    <rect x="0" y="0" width="95" height="8" rx="4" fill="#38bdf8" />
    <rect x="105" y="0" width="95" height="8" rx="4" fill="#38bdf8" />
    <rect x="210" y="0" width="95" height="8" rx="4" fill="#38bdf8" />
    <rect x="315" y="0" width="130" height="8" rx="4" fill="#22c55e" />
  </g>
</svg>